name: Project Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install ShellCheck
      run: sudo apt-get install -y shellcheck
    - name: Run ShellCheck
      run: shellcheck optimize_and_aero.sh

  verify-assets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check Required Directories
      run: |
        test -d assets/wallpapers
        test -d assets/sounds
        test -d assets/kvantum/AeroGlass
    - name: Check Critical Files
      run: |
        test -f assets/kvantum/AeroGlass/AeroGlass.kvconfig
        test -f assets/kvantum/AeroGlass/AeroGlass.svg
        test -x optimize_and_aero.sh
