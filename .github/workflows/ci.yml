name: Frutiger Aero Master CI 🫧🐬✨

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: 🔍 ShellCheck & Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install ShellCheck
      run: sudo apt-get install -y shellcheck
    - name: Run ShellCheck
      run: shellcheck optimize_and_aero.sh

  verify-assets:
    name: 📦 Asset Integrity Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify Sound Assets
      run: |
        test -d assets/sounds/Aero/stereo
        test -f assets/sounds/Aero/index.theme
        test -s assets/sounds/Aero/stereo/desktop-login.ogg
    - name: Verify Kvantum Assets
      run: |
        test -d assets/kvantum/Windows7Aero
        test -f assets/kvantum/Windows7Aero/Windows7Aero.kvconfig
    - name: Verify Look and Feel Assets
      run: |
        test -d assets/look-and-feel/com.gemini.frutigeraeromaster
        test -f assets/look-and-feel/com.gemini.frutigeraeromaster/contents/defaults

  smoke-test:
    name: 🚀 Smoke Test (Multi-DE Detection)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        de: [kde, gnome, xfce]
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y whiptail bats
    - name: Run Unit Tests (Bats)
      run: bats tests/linux/unit_tests.bats
    - name: Test DE Detection and Basic Syntax
      env:
        XDG_CURRENT_DESKTOP: ${{ matrix.de }}
      run: |
        bash -n optimize_and_aero.sh
        bash -c "source ./optimize_and_aero.sh && detect_system && echo 'Detected DE: \$DE_TYPE' | grep -i '${{ matrix.de }}'"

  windows-test:
    name: 🪟 Windows Port Tests
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Pester Tests
      shell: powershell
      run: |
        # Initialize variables for testing if needed
        # In a real CI, we might skip the Admin check or mock it
        Invoke-Pester -Path windows/tests/unit_tests.Tests.ps1 -Output Detailed
